# Quiet companion — text-only ambient splash. Big slant-figlet clock as the
# focal point, a soft greeting + date underneath, then a centred fortune
# cookie that wraps over a few lines, and a single-line daily quote at the
# bottom. No tasks, no feeds, no images — just typography and breathing
# room. The slant figlet is the design move: it reads as warmer than
# ansi_shadow, more "study lamp" than "ops dashboard".

[showcase]
title = "Quiet companion"
description = "Text-only ambient splash. Slant figlet clock as the focal point; greeting + date; centred fortune cookie; daily quote. Typography and whitespace, nothing more."
context = "home"
requires = []

# ── Widgets ────────────────────────────────────────────────────────

# Hero clock — `slant` figlet at full pixel size for max presence.
[[widget]]
id = "clock_hero"
fetcher = "clock"
format = "%H:%M"
render = { type = "text_ascii", style = "figlet", font = "slant", color = "panel_title", align = "center" }

# Greeting + date as a single subtitle row beneath the clock.
[[widget]]
id = "greeting_prefix"
fetcher = "basic_static"
format = "good "
render = { type = "text_plain", align = "right", color = "text_secondary" }

[[widget]]
id = "greeting"
fetcher = "clock_derived"
render = { type = "text_plain", align = "left", color = "text_secondary" }
  [widget.options]
  kind = "time_of_day"

[[widget]]
id = "date"
fetcher = "clock"
format = "%A · %e %B %Y"
render = { type = "text_plain", align = "center", color = "text_secondary" }

# Almanac strip — moon · zodiac · day-of-year — adds a touch of cosmic
# texture without veering into "data dashboard" territory.
[[widget]]
id = "moon"
fetcher = "clock_derived"
render = { type = "text_plain", align = "right" }
  [widget.options]
  kind = "moon_phase"

[[widget]]
id = "sep1"
fetcher = "basic_static"
format = "  ·  "
render = { type = "text_plain", align = "center" }

[[widget]]
id = "zodiac"
fetcher = "clock_derived"
render = { type = "text_plain", align = "center" }
  [widget.options]
  kind = "zodiac"

[[widget]]
id = "sep2"
fetcher = "basic_static"
format = "  ·  "
render = { type = "text_plain", align = "center" }

[[widget]]
id = "doy"
fetcher = "clock_derived"
render = { type = "text_plain", align = "left" }
  [widget.options]
  kind = "day_of_year"

# Fortune cookie — wraps over a couple of lines; the row gives it breathing
# room either way.
[[widget]]
id = "fortune"
fetcher = "random_fortune"
render = { type = "list_plain", align = "center" }

# Daily quote — single Text line, "value — author".
[[widget]]
id = "quote"
fetcher = "random_quote"
shape = "text"
render = { type = "text_plain", align = "center", color = "panel_title" }

# ── Layout ─────────────────────────────────────────────────────────

[[row]]
height = { length = 4 }

# Big clock — figlet at full pixel size is ~6 rows tall.
[[row]]
height = { length = 6 }
  [[row.child]]
  widget = "clock_hero"

[[row]]
height = { length = 1 }

# Greeting seam + date.
[[row]]
height = { length = 1 }
flex = "center"
  [[row.child]]
  widget = "greeting_prefix"
  width = { length = 5 }
  [[row.child]]
  widget = "greeting"
  width = { length = 14 }

[[row]]
height = { length = 1 }
  [[row.child]]
  widget = "date"

[[row]]
height = { length = 2 }

# Almanac strip.
[[row]]
height = { length = 1 }
flex = "center"
  [[row.child]]
  widget = "moon"
  width = { length = 4 }
  [[row.child]]
  widget = "sep1"
  width = { length = 5 }
  [[row.child]]
  widget = "zodiac"
  width = { length = 14 }
  [[row.child]]
  widget = "sep2"
  width = { length = 5 }
  [[row.child]]
  widget = "doy"
  width = { length = 14 }

[[row]]
height = { length = 3 }

# Fortune cookie — centred, generous width, can wrap to multiple lines.
[[row]]
height = { length = 4 }
flex = "center"
  [[row.child]]
  widget = "fortune"
  width = { length = 90 }

[[row]]
height = { length = 2 }

# Daily quote, single centred line.
[[row]]
height = { length = 1 }
flex = "center"
  [[row.child]]
  widget = "quote"
  width = { length = 100 }

[[row]]
height = { fill = 1 }
