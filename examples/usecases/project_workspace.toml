# Workspace status splash — frames itself as a "what shape is this repo in
# right now" view. Repo name as a chunky figlet header on bg=subtle, then
# four count tiles (modified / added / deleted / untracked) as the visual
# pulse, the blame heatmap as a wide visual band showing where the recent
# churn lives, and tables for status / worktrees / recent commits below.
# The blame heatmap is the design move — most workspace dashboards skip the
# spatial dimension, this one leans into it.

[showcase]
title = "Git workspace"
description = "Repo figlet on a subtle band, four count tiles as the pulse, blame heatmap as a wide visual showing where recent churn lives, then the status / worktrees / recent-commits tables. Spatial-first workspace view."
context = "project"
requires = ["local git repo"]

# ── Widgets ────────────────────────────────────────────────────────

# Repo name in figlet — `quadrant` blocks at panel_title colour.
[[widget]]
id = "name"
fetcher = "git_repo_name"
render = { type = "text_ascii", style = "blocks", pixel_size = "quadrant", color = "panel_title", align = "center" }

# Status one-liner.
[[widget]]
id = "status_line"
fetcher = "git_status"
shape = "text"
render = { type = "text_plain", align = "center", color = "text_secondary" }

# Status badge (clean/dirty tone).
[[widget]]
id = "status_badge"
fetcher = "git_status"
shape = "badge"
render = "status_badge"

# 3 tiles below: stash · tag · age.
[[widget]]
id = "stash"
fetcher = "git_stash_count"
shape = "text"
render = { type = "text_plain", align = "center" }

[[widget]]
id = "tag"
fetcher = "git_latest_tag"
shape = "text"
render = { type = "text_plain", align = "center", color = "panel_title" }

[[widget]]
id = "age"
fetcher = "git_age"
shape = "text"
render = { type = "text_plain", align = "center", color = "text_secondary" }

# Commit activity sparkline — wide horizontal band showing the repo's
# heartbeat over the last weeks. Replaces the blame heatmap which renders
# as uniform cells in sample data.
[[widget]]
id = "activity"
fetcher = "git_commits_activity"
shape = "number_series"
render = { type = "chart_sparkline", style = "bars" }

# Detailed status as Entries.
[[widget]]
id = "status_table"
fetcher = "git_status"
shape = "entries"
render = "grid_table"

# Worktrees.
[[widget]]
id = "worktrees"
fetcher = "git_worktrees"
shape = "entries"
render = "grid_table"

# Recent commits timeline.
[[widget]]
id = "commits"
fetcher = "git_recent_commits"
render = "list_timeline"
  [widget.options]
  count = 5

# ── Layout ─────────────────────────────────────────────────────────

# Hero band on bg=subtle.
[[row]]
height = { length = 1 }
bg = "subtle"

[[row]]
height = { length = 4 }
bg = "subtle"
  [[row.child]]
  widget = "name"

[[row]]
height = { length = 1 }
bg = "subtle"
  [[row.child]]
  widget = "status_line"

[[row]]
height = { length = 1 }
bg = "subtle"
flex = "center"
  [[row.child]]
  widget = "status_badge"
  width = { length = 30 }

[[row]]
height = { length = 1 }
bg = "subtle"

# 3 tiles: stash · tag · age.
[[row]]
height = { length = 1 }
flex = "center"
gap = 2
  [[row.child]]
  widget = "stash"
  width = { length = 30 }
  [[row.child]]
  widget = "tag"
  width = { length = 30 }
  [[row.child]]
  widget = "age"
  width = { length = 30 }

[[row]]
height = { length = 1 }

# Activity sparkline — wide visual band, full canvas width.
[[row]]
height = { length = 5 }
flex = "center"
  [[row.child]]
  widget = "activity"
  width = { length = 100 }
  border = "top"
  title = "  commit activity  "
  title_align = "left"

[[row]]
height = { length = 1 }

# Body: status table | worktrees | commits.
[[row]]
height = { length = 8 }
flex = "center"
gap = 2
  [[row.child]]
  widget = "status_table"
  width = { length = 30 }
  border = "top"
  title = "  status  "
  title_align = "left"
  [[row.child]]
  widget = "worktrees"
  width = { length = 30 }
  border = "top"
  title = "  worktrees  "
  title_align = "left"
  [[row.child]]
  widget = "commits"
  width = { length = 38 }
  border = "top"
  title = "  recent commits  "
  title_align = "left"

[[row]]
height = { fill = 1 }
