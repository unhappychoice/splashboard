# Todoist GTD dashboard — designed as a real task-app workspace, not a "splash
# with feeds underneath". Today's date as the masthead figlet on a bg=subtle
# band, three count badges flanking it (overdue / today / upcoming, each
# colour-toned) act as the visual hierarchy. The body splits into three task
# columns underneath, and a priority breakdown bar chart anchors the bottom
# right corner so progress feels measurable.

[showcase]
title = "Todoist GTD"
description = "Date masthead, three count badges as the hero hierarchy, three task columns (overdue / today / upcoming), and a priority breakdown bar chart that grounds the bottom of the canvas. Designed as a task workspace, not a splash."
context = "home"
requires = ["Todoist API token (`TODOIST_TOKEN`)"]

# ── Widgets ────────────────────────────────────────────────────────

# Date masthead figlet — `quadrant` blocks at panel_title colour. Acts as the
# splash's emotional anchor: every morning, you know what day it is.
[[widget]]
id = "date"
fetcher = "clock"
format = "%A · %e %b"
render = { type = "text_ascii", style = "blocks", pixel_size = "quadrant", color = "panel_title", align = "center" }

# Three count badges — same fetcher with different `filter_due`. Tone field
# on the Badge shape drives colouring (overdue → error, today → warn, etc.).
[[widget]]
id = "count_overdue"
fetcher = "todoist_tasks"
shape = "badge"
render = { type = "status_badge", padding = 2 }
  [widget.options]
  filter_due = "overdue"

[[widget]]
id = "count_today"
fetcher = "todoist_tasks"
shape = "badge"
render = { type = "status_badge", padding = 2 }
  [widget.options]
  filter_due = "today"

[[widget]]
id = "count_upcoming"
fetcher = "todoist_tasks"
shape = "badge"
render = { type = "status_badge", padding = 2 }
  [widget.options]
  filter_due = "upcoming"

# Three task columns.
[[widget]]
id = "list_overdue"
fetcher = "todoist_tasks"
render = { type = "list_links", max_items = 10 }
  [widget.options]
  filter_due = "overdue"

[[widget]]
id = "list_today"
fetcher = "todoist_tasks"
render = { type = "list_links", max_items = 10 }
  [widget.options]
  filter_due = "today"

[[widget]]
id = "list_upcoming"
fetcher = "todoist_tasks"
render = { type = "list_links", max_items = 10 }
  [widget.options]
  filter_due = "upcoming"

# Priority breakdown — `todoist_tasks` Bars shape gives one bar per priority
# bucket (P1/P2/P3/P4/none). Horizontal bar chart reads cleanly in a small slot.
[[widget]]
id = "priority"
fetcher = "todoist_tasks"
shape = "bars"
render = { type = "chart_bar", horizontal = true }
  [widget.options]
  filter_due = "all"

# Today's quote anchors the bottom-left as a quiet contemplative line.
[[widget]]
id = "quote"
fetcher = "random_quote"
shape = "text"
render = { type = "text_plain", align = "center", color = "text_secondary" }

# ── Layout ─────────────────────────────────────────────────────────
# 116-cell content band centred on the 120 canvas.

# Hero band on bg=subtle: date figlet, then the three count badges centred
# below it.
[[row]]
height = { length = 1 }
bg = "subtle"

[[row]]
height = { length = 4 }
bg = "subtle"
  [[row.child]]
  widget = "date"

[[row]]
height = { length = 1 }
bg = "subtle"
flex = "center"
gap = 4
  [[row.child]]
  widget = "count_overdue"
  width = { length = 24 }
  [[row.child]]
  widget = "count_today"
  width = { length = 24 }
  [[row.child]]
  widget = "count_upcoming"
  width = { length = 24 }

[[row]]
height = { length = 1 }
bg = "subtle"

# Three task columns — uniform 36 cells × 3 + 4 gap × 2 = 116.
[[row]]
height = { length = 18 }
flex = "center"
gap = 4
  [[row.child]]
  widget = "list_overdue"
  width = { length = 36 }
  border = "top"
  title = "  overdue  "
  title_align = "left"
  [[row.child]]
  widget = "list_today"
  width = { length = 36 }
  border = "top"
  title = "  today  "
  title_align = "left"
  [[row.child]]
  widget = "list_upcoming"
  width = { length = 36 }
  border = "top"
  title = "  upcoming  "
  title_align = "left"

[[row]]
height = { length = 1 }

# Bottom band: priority bars (full width) — quote was a 1-line throwaway and
# left a 5-row dead zone next to it; cut it.
[[row]]
height = { length = 6 }
flex = "center"
  [[row.child]]
  widget = "priority"
  width = { length = 116 }
  border = "top"
  title = "  by priority  "
  title_align = "left"

[[row]]
height = { length = 1 }

[[row]]
height = { length = 1 }
flex = "center"
  [[row.child]]
  widget = "quote"
  width = { length = 116 }

[[row]]
height = { fill = 1 }
